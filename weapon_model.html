<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bloodborne 武器カタログ</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            border-bottom: 2px solid #ff8c00;
            padding-bottom: 10px;
            text-align: center;
        }

        h2 {
            color: #ff8c00;
        }

        h3 {
            color: #ff8c00;
            text-align: left;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        a {
            color: #ff8c00;
            text-decoration: none;
            padding: 8px 0;
            display: inline-block;
        }

        a:hover {
            text-decoration: underline;
        }

        nav {
            background-color: #111;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 40px;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        .weapon-card {
            margin-bottom: 60px;
        }

        /* ギャラリーコンテナ */
        .gallery {
            position: relative;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* メイン表示エリア */
        .gallery__main {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #0a0a0a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery__main img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* 左右ボタン */
        .gallery__nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #ff8c00;
            border: 1px solid #ff8c00;
            padding: 15px 10px;
            cursor: pointer;
            font-size: 1.5rem;
            z-index: 10;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .gallery__nav:hover {
            background: rgba(255, 140, 0, 0.2);
        }

        .gallery__nav--prev { left: 10px; }
        .gallery__nav--next { right: 10px; }

        /* サムネイル一覧（横並び） */
        .gallery__thumbs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: thin;
            scrollbar-color: #ff8c00 #111;
        }

        .gallery__thumbs img {
            width: 100px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 4px;
            opacity: 0.6;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .gallery__thumbs img.active {
            border-color: #ff8c00;
            opacity: 1;
        }

        hr {
            border: 0;
            height: 1px;
            background: #444;
            margin: 40px 0;
        }

        @media (max-width: 768px) {
            body { padding: 15px; }
            h3 { font-size: 1.3rem; }
            .gallery__nav { padding: 10px 5px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bloodborne 武器カタログ</h1>

        <nav>
            <h2>目次</h2>
            <ul>
                <li><a href="#amygdalan-arm">アメンドーズの腕 | Amygdalan Arm</a></li>
                <li><a href="#beast-claw">獣の爪 | Beast Claw</a></li>
                <li><a href="#beast-cutter">獣肉断ち | Beast Cutter</a></li>
                <li><a href="#beast-hunting-axe">獣狩りの斧 | Hunter's Axe</a></li>
                <li><a href="#beasthunter-saif">獣狩りの曲刀 | Beasthunter Saif</a></li>
            </ul>
        </nav>

        <!-- 各武器セクションにギャラリー機能を実装 -->
        <div id="amygdalan-arm" class="weapon-card">
            <h3>アメンドーズの腕 | Amygdalan Arm</h3>
            <div class="gallery" data-index="0">
                <div class="gallery__main">
                    <button class="gallery__nav gallery__nav--prev" onclick="changeImage(this, -1)">❮</button>
                    <img src="./assets/amygdalan_arm.ta.png" alt="アメンドーズの腕">
                    <button class="gallery__nav gallery__nav--next" onclick="changeImage(this, 1)">❯</button>
                </div>
                <div class="gallery__thumbs">
                    <!-- 将来的にここに差分画像を追加 -->
                    <img src="./assets/amygdalan_arm.ta.png" class="active" onclick="selectImage(this)" alt="差分1">
                </div>
            </div>
        </div>

        <hr>

        <div id="beast-claw" class="weapon-card">
            <h3>獣の爪 | Beast Claw</h3>
            <div class="gallery" data-index="0">
                <div class="gallery__main">
                    <button class="gallery__nav gallery__nav--prev" onclick="changeImage(this, -1)">❮</button>
                    <img src="./assets/beast_claw.png" alt="獣の爪">
                    <button class="gallery__nav gallery__nav--next" onclick="changeImage(this, 1)">❯</button>
                </div>
                <div class="gallery__thumbs">
                    <img src="./assets/beast_claw.png" class="active" onclick="selectImage(this)" alt="差分1">
                </div>
            </div>
        </div>

        <hr>

        <div id="beast-cutter" class="weapon-card">
            <h3>獣肉断ち | Beast Cutter</h3>
            <div class="gallery" data-index="0">
                <div class="gallery__main">
                    <button class="gallery__nav gallery__nav--prev" onclick="changeImage(this, -1)">❮</button>
                    <img src="./assets/beast_cutter.t.png" alt="獣肉断ち">
                    <button class="gallery__nav gallery__nav--next" onclick="changeImage(this, 1)">❯</button>
                </div>
                <div class="gallery__thumbs">
                    <img src="./assets/beast_cutter.t.png" class="active" onclick="selectImage(this)" alt="差分1">
                </div>
            </div>
        </div>

        <hr>

        <div id="beast-hunting-axe" class="weapon-card">
            <h3>獣狩りの斧 | Hunter's Axe</h3>
            <div class="gallery" data-index="0">
                <div class="gallery__main">
                    <button class="gallery__nav gallery__nav--prev" onclick="changeImage(this, -1)">❮</button>
                    <img src="./assets/beast_hunting_axe.t.png" alt="獣狩りの斧">
                    <button class="gallery__nav gallery__nav--next" onclick="changeImage(this, 1)">❯</button>
                </div>
                <div class="gallery__thumbs">
                    <img src="./assets/beast_hunting_axe.t.png" class="active" onclick="selectImage(this)" alt="差分1">
                </div>
            </div>
        </div>

        <hr>

        <div id="beasthunter-saif" class="weapon-card">
            <h3>獣狩りの曲刀 | Beasthunter Saif</h3>
            <div class="gallery" data-index="0">
                <div class="gallery__main">
                    <button class="gallery__nav gallery__nav--prev" onclick="changeImage(this, -1)">❮</button>
                    <img src="./assets/beasthunter_saif.png" alt="獣狩りの曲刀">
                    <button class="gallery__nav gallery__nav--next" onclick="changeImage(this, 1)">❯</button>
                </div>
                <div class="gallery__thumbs">
                    <img src="./assets/beasthunter_saif.png" class="active" onclick="selectImage(this)" alt="差分1">
                </div>
            </div>
        </div>
    </div>

    <script>
        function selectImage(thumb) {
            const gallery = thumb.closest('.gallery');
            const mainImg = gallery.querySelector('.gallery__main img');
            const thumbs = gallery.querySelectorAll('.gallery__thumbs img');
            
            // 全サムネイルのactive解除
            thumbs.forEach(t => t.classList.remove('active'));
            // 選択されたものにactive付与
            thumb.classList.add('active');
            // メイン画像の差し替え
            mainImg.src = thumb.src;
            
            // インデックスの更新
            const index = Array.from(thumbs).indexOf(thumb);
            gallery.dataset.index = index;
        }

        function changeImage(btn, step) {
            const gallery = btn.closest('.gallery');
            const thumbs = gallery.querySelectorAll('.gallery__thumbs img');
            let currentIndex = parseInt(gallery.dataset.index);
            
            let newIndex = currentIndex + step;
            if (newIndex < 0) newIndex = thumbs.length - 1;
            if (newIndex >= thumbs.length) newIndex = 0;
            
            selectImage(thumbs[newIndex]);
        }
    </script>
</body>
</html>
