<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bloodborne Trick Weapons Catalog</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-primary: #ffffff;
            --accent-color: #ff8c00; /* オレンジ */
            --border-color: #333333;
            --card-bg: #0a0a0a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
        }

        header {
            padding: 3rem 1rem;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
        }

        h1 {
            margin: 0;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.2rem;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* 目次 */
        .toc-container {
            margin-bottom: 3rem;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .toc-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 1rem;
            border-left: 4px solid var(--accent-color);
            padding-left: 0.8rem;
        }

        .toc-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 0.5rem;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .toc-list a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .toc-list a:hover {
            text-decoration: underline;
        }

        /* 武器リスト */
        .weapon-section {
            margin-bottom: 4rem;
            scroll-margin-top: 2rem;
        }

        .weapon-name-row {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .main-display {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background: #111;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .main-display img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: none;
            padding: 1rem;
            cursor: pointer;
            font-size: 1.5rem;
            z-index: 2;
        }

        .nav-btn:hover { background: var(--accent-color); }
        .prev { left: 0; }
        .next { right: 0; }

        .thumbnail-row {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .thumbnail-row img {
            width: 100px;
            height: 60px;
            object-fit: cover;
            cursor: pointer;
            opacity: 0.6;
            border: 1px solid var(--border-color);
            transition: 0.2s;
        }

        .thumbnail-row img:hover, .thumbnail-row img.active {
            opacity: 1;
            border-color: var(--accent-color);
        }

        /* パス情報 */
        .path-info {
            margin-top: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .path-line {
            padding: 0.2rem 0;
            overflow-wrap: anywhere;
        }

        /* ページトップボタン */
        #back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: var(--accent-color);
            background-size: cover;
            background-position: center;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            transition: transform 0.2s;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #back-to-top:hover {
            transform: scale(1.15);
            /* background-image: url('./assets/weaponmodel/hover_icon.png'); */
        }

        #back-to-top::after {
            content: "TOP";
            color: white;
            font-weight: bold;
            font-size: 0.7rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-shadow: 1px 1px 2px #000;
        }

        hr {
            border: 0;
            height: 1px;
            background: var(--border-color);
            margin: 4rem 0;
        }

        @media (max-width: 768px) {
            .weapon-name-row { font-size: 1.4rem; }
            .toc-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <h1>Trick Weapons Catalog</h1>
</header>

<div class="container">
    <nav class="toc-container">
        <div class="toc-title">INDEX</div>
        <ul class="toc-list" id="tocList"></ul>
    </nav>

    <div id="weaponContainer"></div>
</div>

<button id="back-to-top" title="Go to top"></button>

<script>
    const weapons = [
        { id: "saw_cleaver", jp: "ノコギリ鉈", en: "Saw Cleaver" },
        { id: "saw_spear", jp: "ノコギリ槍", en: "Saw Spear" },
        { id: "beast_hunting_axe", jp: "獣狩りの斧", en: "Hunter Axe" },
        { id: "beasthunter_saif", jp: "獣狩りの曲刀", en: "Beasthunter Saif" },
        { id: "threaded_cane", jp: "仕込み杖", en: "Threaded Cane" },
        { id: "beast_cutter", jp: "獣肉断ち", en: "Beast Cutter" },
        { id: "burial_blade", jp: "葬送の刃", en: "Burial Blade" },
        { id: "blade_of_mercy", jp: "慈悲の刃", en: "Blade of Mercy" },
        { id: "rifle_spear", jp: "銃槍", en: "Rifle Spear" },
        { id: "stake_driver", jp: "パイルハンマー", en: "Stake Driver" },
        { id: "boom_hammer", jp: "爆発金槌", en: "Boom Hammer" },
        { id: "whirligig_saw", jp: "回転ノコギリ", en: "Whirligig Saw" },
        { id: "tonitrus", jp: "トニトルス", en: "Tonitrus" },
        { id: "kirk_hammer", jp: "教会の石槌", en: "Kirkhammer" },
        { id: "church_pick", jp: "教会の杭", en: "Church Pick" },
        { id: "ludwiq_the_holy_blade", jp: "ルドウイークの聖剣", en: "Ludwig's Holy Blade" },
        { id: "holy_moonlight_sword", jp: "月光の聖剣", en: "Holy Moonlight Sword" },
        { id: "simons_bowblade", jp: "シモンの弓剣", en: "Simon's Bowblade" },
        { id: "logarius_wheel", jp: "ローゲリウスの車輪", en: "Logarius' Wheel" },
        { id: "bloodletter", jp: "瀉血の槌", en: "Bloodletter" },
        { id: "amygdalan_arm", jp: "小アメンの腕", en: "Amygdalan Arm" },
        { id: "beast_claw", jp: "獣の爪", en: "Beast Claw" },
        { id: "kos_parasite", jp: "ゴースの寄生虫", en: "Kos Parasite" },
        { id: "reiterpallasch", jp: "レイテルパラッシュ", en: "Reiterpallasch" },
        { id: "chikage", jp: "千景", en: "Chikage" },
        { id: "rakuyo", jp: "落葉", en: "Rakuyo" }
    ];

    const container = document.getElementById('weaponContainer');
    const tocList = document.getElementById('tocList');
    const basePath = './assets/weaponmodel/';

    weapons.forEach(w => {
        const fullName = `${w.jp} | ${w.en}`;
        
        // TOC
        const li = document.createElement('li');
        li.innerHTML = `<a href="#${w.id}">${fullName}</a>`;
        tocList.appendChild(li);

        // Section
        const section = document.createElement('section');
        section.className = 'weapon-section';
        section.id = w.id;

        const imgPathNormal = `${basePath}${w.id}.png`;
        const imgPathTrans = `${basePath}${w.id}.t.png`;
        const gifPathNormal = `${basePath}${w.id}.gif`;
        const gifPathTrans = `${basePath}${w.id}.t.gif`;

        section.innerHTML = `
            <div class="weapon-name-row">${fullName}</div>
            <div class="gallery" data-weapon="${w.id}">
                <div class="main-display">
                    <button class="nav-btn prev">❮</button>
                    <img src="${imgPathNormal}" alt="${w.en}" class="current-img">
                    <button class="nav-btn next">❯</button>
                </div>
                <div class="thumbnail-row">
                    <img src="${imgPathNormal}" class="thumb active" data-full="${imgPathNormal}">
                    <img src="${imgPathTrans}" class="thumb" data-full="${imgPathTrans}" onerror="this.style.display='none'">
                    <img src="${gifPathNormal}" class="thumb" data-full="${gifPathNormal}" onerror="this.style.display='none'">
                    <img src="${gifPathTrans}" class="thumb" data-full="${gifPathTrans}" onerror="this.style.display='none'">
                </div>
            </div>
            <div class="path-info">
                <div class="path-line">${w.jp} | ${w.en}</div>
                <div class="path-line">${imgPathNormal}</div>
            </div>
            <hr>
        `;
        container.appendChild(section);
    });

    // Gallery Logic
    document.querySelectorAll('.gallery').forEach(gal => {
        const mainImg = gal.querySelector('.current-img');
        const thumbs = gal.querySelectorAll('.thumb');
        let currentIndex = 0;

        const updateGallery = (index) => {
            const visibleThumbs = Array.from(thumbs).filter(t => t.style.display !== 'none');
            if (visibleThumbs.length === 0) return;
            
            currentIndex = (index + visibleThumbs.length) % visibleThumbs.length;
            const targetThumb = visibleThumbs[currentIndex];
            
            mainImg.src = targetThumb.dataset.full;
            thumbs.forEach(t => t.classList.remove('active'));
            targetThumb.classList.add('active');
        };

        gal.querySelector('.next').onclick = () => updateGallery(currentIndex + 1);
        gal.querySelector('.prev').onclick = () => updateGallery(currentIndex - 1);

        thumbs.forEach((thumb, idx) => {
            thumb.onclick = () => {
                const visibleIdx = Array.from(gal.querySelectorAll('.thumb')).filter(t => t.style.display !== 'none').indexOf(thumb);
                updateGallery(visibleIdx);
            };
        });
    });

    // Back to top
    const topBtn = document.getElementById('back-to-top');
    window.onscroll = () => {
        topBtn.style.display = (window.scrollY > 300) ? 'block' : 'none';
    };
    topBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

</script>

</body>
</html>
