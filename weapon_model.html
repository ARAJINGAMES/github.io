<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bloodborne 武器カタログ</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            border-bottom: 2px solid #ff8c00;
            padding-bottom: 10px;
            text-align: center;
        }

        h2 {
            color: #ff8c00;
        }

        h3 {
            color: #ff8c00;
            text-align: left;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        a {
            color: #ff8c00;
            text-decoration: none;
            padding: 8px 0;
            display: inline-block;
        }

        a:hover {
            text-decoration: underline;
        }

        nav {
            background-color: #111;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 40px;
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        /* フェードイン用スタイル */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            will-change: opacity, transform;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .weapon-card {
            margin-bottom: 60px;
        }

        .gallery {
            position: relative;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .gallery__main {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #0a0a0a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery__main img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .gallery__nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #ff8c00;
            border: 1px solid #ff8c00;
            padding: 15px 10px;
            cursor: pointer;
            font-size: 1.5rem;
            z-index: 10;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .gallery__nav:hover {
            background: rgba(255, 140, 0, 0.2);
        }

        .gallery__nav--prev { left: 10px; }
        .gallery__nav--next { right: 10px; }

        .gallery__thumbs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: thin;
            scrollbar-color: #ff8c00 #111;
        }

        .gallery__thumbs img {
            width: 100px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 4px;
            opacity: 0.6;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .gallery__thumbs img.active {
            border-color: #ff8c00;
            opacity: 1;
        }

        hr {
            border: 0;
            height: 1px;
            background: #444;
            margin: 40px 0;
        }

        @media (max-width: 768px) {
            body { padding: 15px; }
            h3 { font-size: 1.3rem; }
            .gallery__nav { padding: 10px 5px; }
        }

        /* ページの先頭に戻るボタン */
        .back-to-top {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 70px;
            height: 70px;
            background-color: #ff8c00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease, visibility 0.3s;
            opacity: 0;
            visibility: hidden;
            border: none;
            padding: 0;
            overflow: hidden;
        }

        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            transform: scale(1.15);
        }

        /* ボタン内の画像レイヤー（背景画像として制御） */
        .back-to-top__icon {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 0.3s ease;
            /* 通常時の画像URLをここに */
            background-image: url('https://via.placeholder.com/70/ff8c00/ffffff?text=TOP');
        }

        .back-to-top:hover .back-to-top__icon {
            /* ホバー時の画像URLをここに */
            background-image: url('https://via.placeholder.com/70/ffffff/ff8c00?text=GO');
        }

        /* テキストラベル */
        .back-to-top__label {
            position: relative;
            z-index: 2;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .back-to-top:hover .back-to-top__label {
            color: #ff8c00;
            text-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bloodborne 武器カタログ</h1>

        <nav>
            <h2>目次</h2>
            <ul>
                <li><a href="#amygdalan-arm">アメンドーズの腕 | Amygdalan Arm</a></li>
                <li><a href="#beast-claw">獣の爪 | Beast Claw</a></li>
                <li><a href="#beast-cutter">獣肉断ち | Beast Cutter</a></li>
                <li><a href="#beast-hunting-axe">獣狩りの斧 | Hunter's Axe</a></li>
                <li><a href="#beasthunter-saif">獣狩りの曲刀 | Beasthunter Saif</a></li>
            </ul>
        </nav>

        <div id="amygdalan-arm" class="weapon-card reveal">
            <h3>アメンドーズの腕 | Amygdalan Arm</h3>
            <div class="gallery" data-index="0">
                <div class="gallery__main">
                    <button class="gallery__nav gallery__nav--prev" onclick="changeImage(this, -1)">❮</button>
                    <img src="./assets/weaponmodel/amygdalan_arm.ta.png" alt="アメンドーズの腕 1">
                    <button class="gallery__nav gallery__nav--next" onclick="changeImage(this, 1)">❯</button>
                </div>
                <div class="gallery__thumbs">
                    <img src="./assets/weaponmodel/amygdalan_arm.ta.png" class="active" onclick="selectImage(this)" alt="差分1">
                    <img src="./assets/weaponmodel/amygdalan_arm.ta.png" onclick="selectImage(this)" alt="差分2">
                    <img src="./assets/weaponmodel/amygdalan_arm.ta.png" onclick="selectImage(this)" alt="差分3">
                </div>
            </div>
            <hr>
        </div>

        <div id="beast-claw" class="weapon-card reveal">
            <h3>獣の爪 | Beast Claw</h3>
            <div class="gallery" data-index="0">
                <div class="gallery__main">
                    <button class="gallery__nav gallery__nav--prev" onclick="changeImage(this, -1)">❮</button>
                    <img src="./assets/weaponmodel/beast_claw.png" alt="獣の爪">
                    <button class="gallery__nav gallery__nav--next" onclick="changeImage(this, 1)">❯</button>
                </div>
                <div class="gallery__thumbs">
                    <img src="./assets/weaponmodel/beast_claw.png" class="active" onclick="selectImage(this)" alt="差分1">
                </div>
            </div>
            <hr>
        </div>

        <!-- ページの先頭に戻るボタン -->
        <button id="backToTop" class="back-to-top" title="ページの先頭に戻る">
            <div class="back-to-top__icon"></div>
            <span class="back-to-top__label">ページの<br>先頭に戻る</span>
        </button>

        <div id="beast-cutter" class="weapon-card reveal">
            <h3>獣肉断ち | Beast Cutter</h3>
            <div class="gallery" data-index="0">
                <div class="gallery__main">
                    <button class="gallery__nav gallery__nav--prev" onclick="changeImage(this, -1)">❮</button>
                    <img src="./assets/weaponmodel/beast_cutter.t.png" alt="獣肉断ち">
                    <button class="gallery__nav gallery__nav--next" onclick="changeImage(this, 1)">❯</button>
                </div>
                <div class="gallery__thumbs">
                    <img src="./assets/weaponmodel/beast_cutter.t.png" class="active" onclick="selectImage(this)" alt="差分1">
                </div>
            </div>
            <hr>
        </div>

        <div id="beast-hunting-axe" class="weapon-card reveal">
            <h3>獣狩りの斧 | Hunter's Axe</h3>
            <div class="gallery" data-index="0">
                <div class="gallery__main">
                    <button class="gallery__nav gallery__nav--prev" onclick="changeImage(this, -1)">❮</button>
                    <img src="./assets/weaponmodel/beast_hunting_axe.t.png" alt="獣狩りの斧">
                    <button class="gallery__nav gallery__nav--next" onclick="changeImage(this, 1)">❯</button>
                </div>
                <div class="gallery__thumbs">
                    <img src="./assets/weaponmodel/beast_hunting_axe.t.png" class="active" onclick="selectImage(this)" alt="差分1">
                </div>
            </div>
            <hr>
        </div>

        <div id="beasthunter-saif" class="weapon-card reveal">
            <h3>獣狩りの曲刀 | Beasthunter Saif</h3>
            <div class="gallery" data-index="0">
                <div class="gallery__main">
                    <button class="gallery__nav gallery__nav--prev" onclick="changeImage(this, -1)">❮</button>
                    <img src="./assets/weaponmodel/beasthunter_saif.png" alt="獣狩りの曲刀">
                    <button class="gallery__nav gallery__nav--next" onclick="changeImage(this, 1)">❯</button>
                </div>
                <div class="gallery__thumbs">
                    <img src="./assets/weaponmodel/beasthunter_saif.png" class="active" onclick="selectImage(this)" alt="差分1">
                </div>
            </div>
        </div>
    </div>

    <script>
        function selectImage(thumb) {
            const gallery = thumb.closest('.gallery');
            const mainImg = gallery.querySelector('.gallery__main img');
            const thumbs = gallery.querySelectorAll('.gallery__thumbs img');
            thumbs.forEach(t => t.classList.remove('active'));
            thumb.classList.add('active');
            mainImg.src = thumb.src;
            gallery.dataset.index = Array.from(thumbs).indexOf(thumb);
        }

        function changeImage(btn, step) {
            const gallery = btn.closest('.gallery');
            const thumbs = gallery.querySelectorAll('.gallery__thumbs img');
            if (thumbs.length <= 1) return;
            let currentIndex = parseInt(gallery.dataset.index);
            let newIndex = (currentIndex + step + thumbs.length) % thumbs.length;
            selectImage(thumbs[newIndex]);
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        // ページの先頭に戻るボタンの制御
        const backToTopBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.classList.add('visible');
            } else {
                backToTopBtn.classList.remove('visible');
            }
        });

        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
